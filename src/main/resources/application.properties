spring.application.name=event-driven-notification-processor

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.notificationprocessor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

resilience4j.retry.instances.notifications.max-attempts=3
resilience4j.retry.instances.notifications.wait-duration=500ms
resilience4j.retry.instances.notifications.retry-exceptions=com.example.notificationprocessor.NotificationDeliveryException
resilience4j.circuitbreaker.instances.notifications.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notifications.sliding-window-size=10
resilience4j.circuitbreaker.instances.notifications.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notifications.wait-duration-in-open-state=10s

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,retries
